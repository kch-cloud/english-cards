<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>우리반 영어 단어장</title>
<link id="page-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style id="page-style">
:root{
  --bg:#EEF1F6;--surface:#FFFFFF;--surface-2:#F5F7FB;--ink:#18202F;--muted:#5B6579;--line:#D9DEE8;
  --accent:#2F49D1;--accent-ink:#FFFFFF;--accent-soft:#E3E8FC;--rule:#E2574C;--ruled:#DDE6F4;
  --good:#16805A;--good-soft:#DDF3E8;--bad:#C3392F;--bad-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(24,32,47,.06),0 10px 28px rgba(24,32,47,.09);
  --f-en:"Lexend","IBM Plex Sans KR",system-ui,sans-serif;
  --f-ko:"IBM Plex Sans KR","Lexend",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#10131A;--surface:#1A1F2A;--surface-2:#212736;--ink:#E7EAF1;--muted:#9AA3B6;--line:#2F3647;
  --accent:#8FA2FF;--accent-ink:#0D1230;--accent-soft:#252C4B;--rule:#F0766C;--ruled:#273046;
  --good:#4CC994;--good-soft:#16362A;--bad:#FF8479;--bad-soft:#3B1F1D;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#10131A;--surface:#1A1F2A;--surface-2:#212736;--ink:#E7EAF1;--muted:#9AA3B6;--line:#2F3647;
  --accent:#8FA2FF;--accent-ink:#0D1230;--accent-soft:#252C4B;--rule:#F0766C;--ruled:#273046;
  --good:#4CC994;--good-soft:#16362A;--bad:#FF8479;--bad-soft:#3B1F1D;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ko);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-family:var(--f-en);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-family:var(--f-en);font-size:clamp(24px,5vw,32px);line-height:1.15;margin:4px 0 0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
.prefs{display:flex;gap:10px;flex-wrap:wrap}
.prefs label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13.5px}
.notice{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13.5px}
.sets{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-family:var(--f-en);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.65;margin-left:6px;font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tab{border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:600;font-size:15px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab.teacher{font-weight:500}
#view{display:flex;flex-direction:column;gap:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.know{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.again{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent}
.link{border:0;background:none;color:var(--accent);padding:4px;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted)}
/* speak buttons */
.spk{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;color:var(--accent);font-size:13px;font-weight:600;vertical-align:middle;line-height:1}
.spk svg{width:18px;height:18px;flex:none}
.spk.lg{padding:11px 18px;font-size:14.5px}
.spk.lg svg{width:22px;height:22px}
.spk.icon-only{padding:6px}
.spk.speaking{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.spk.speaking svg path:last-child{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
/* cards */
.cardbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:13.5px}
.count{font-family:var(--f-en);font-variant-numeric:tabular-nums;font-size:15px}
.pill{background:var(--good-soft);color:var(--good);border-radius:999px;padding:3px 10px;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.check{display:flex;align-items:center;gap:6px;color:var(--muted)}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.stage{perspective:1600px}
.flash{display:grid;grid-template-columns:minmax(0,1fr);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.2,1);cursor:pointer;outline-offset:6px;border-radius:16px}
.flash.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;min-width:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);min-height:330px;padding:70px 22px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;position:relative;
  background:linear-gradient(to bottom,transparent 50px,var(--rule) 50px,var(--rule) 52px,transparent 52px),var(--surface)}
.back{transform:rotateY(180deg);
  background:linear-gradient(to bottom,transparent 50px,var(--rule) 50px,var(--rule) 52px,transparent 52px),repeating-linear-gradient(to bottom,transparent 0 33px,var(--ruled) 33px 34px),var(--surface)}
.cardno{position:absolute;top:16px;left:20px;font-family:var(--f-en);font-size:12px;letter-spacing:.12em;color:var(--muted);font-variant-numeric:tabular-nums}
.side{position:absolute;top:16px;right:20px;font-size:12px;color:var(--muted)}
.word{font-family:var(--f-en);font-weight:600;font-size:clamp(38px,9vw,58px);line-height:1.1;letter-spacing:-.015em;overflow-wrap:anywhere}
.word.long{font-size:clamp(24px,5.4vw,34px);line-height:1.3;font-weight:500;max-width:30ch}
.face-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hint{font-size:12.5px;color:var(--muted)}
.meaning{font-size:clamp(28px,6.5vw,40px);font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.en-small{font-family:var(--f-en);font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.example{background:var(--surface-2);border-radius:12px;padding:14px 16px;width:100%;max-width:34rem;text-align:left;display:flex;flex-direction:column;gap:6px}
.ex-label{font-size:11.5px;letter-spacing:.1em;color:var(--muted);font-family:var(--f-en);text-transform:uppercase}
.ex-en{font-family:var(--f-en);font-size:17px;line-height:1.45}
.ex-ko{color:var(--muted);font-size:14.5px}
.ex-row{display:flex;gap:6px;flex-wrap:wrap}
.tag-known{position:absolute;top:13px;right:16px;background:var(--good-soft);color:var(--good);font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}
.cardnav{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px}
.subnav{display:flex;justify-content:center;gap:4px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.kbd{text-align:center;font-size:12.5px;color:var(--muted);margin:0}
@media (max-width:520px){.cardnav{grid-template-columns:1fr 1fr}.cardnav .ghost{order:2}.kbd{display:none}}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:20px;line-height:1.3}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--accent);transform:translateY(-2px)}
.mode b{font-size:17px}
.mode .ex{font-family:var(--f-en);color:var(--accent);font-size:13px;font-weight:500}
.mode span{color:var(--muted);font-size:13.5px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.prompt{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0}
.prompt .q-en{font-family:var(--f-en);font-weight:600;font-size:clamp(28px,7vw,44px);line-height:1.2;overflow-wrap:anywhere}
.prompt .q-ko{font-weight:600;font-size:clamp(24px,6vw,34px);line-height:1.3}
.prompt .ask{font-size:14px;color:var(--muted)}
.bigplay{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.bigplay svg{width:42px;height:42px}
.bigplay.speaking{animation:ring 1s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--accent-soft)}100%{box-shadow:0 0 0 18px transparent}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;text-align:left;font-size:16.5px;font-weight:500;min-height:56px;display:flex;gap:10px;align-items:center}
.opt .n{font-family:var(--f-en);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;flex:none}
.opt.en{font-family:var(--f-en)}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback b{font-size:15.5px}
.feedback.ok b{color:var(--good)}.feedback.no b{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.score{font-family:var(--f-en);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:22px;color:var(--muted);font-weight:500}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.review li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.review .en{font-family:var(--f-en);font-weight:600}
.review .ko{color:var(--muted)}
/* match game */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:84px;padding:10px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;transition:transform .12s,opacity .3s}
.tile.en{font-family:var(--f-en);color:var(--accent)}
.tile.sel{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.03)}
.tile.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.tile.gone{opacity:0;pointer-events:none}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.stat{display:flex;gap:18px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-family:var(--f-en)}
/* dictation */
.dict-form{display:flex;gap:8px}
.dict-form input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-family:var(--f-en);font-size:19px}
.dict-form input.ok{border-color:var(--good)}.dict-form input.no{border-color:var(--bad)}
.hintbox{background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:14.5px}
.hintbox .mono{font-family:var(--f-en);letter-spacing:.12em}
/* import */
.import{border-style:dashed;border-width:1.5px}
.imp-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.beta{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:1.5px dashed var(--line);border-radius:12px;padding:22px 16px;background:var(--surface-2);cursor:pointer;overflow-wrap:anywhere}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop b{font-size:15.5px}
.drop span{font-size:13px}
.imp-opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:13.5px}
.imp-opts label{display:flex;align-items:center;gap:6px;color:var(--muted)}
/* settings */
.settings summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;list-style:none}
.settings summary::-webkit-details-marker{display:none}
.settings summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.settings[open] summary::before{transform:rotate(90deg)}
.settings[open]{gap:14px}
.sum-title{font-size:20px;font-weight:600;margin-right:4px}
.pill.off{background:var(--bad-soft);color:var(--bad)}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cfg input{font-family:var(--f-en);font-size:14px}
/* editor */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field input,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:15px}
.field textarea{min-height:340px;font-family:var(--f-en);font-size:14px;line-height:1.7;resize:vertical;white-space:pre;overflow-x:auto}
.format{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.format code{font-family:var(--f-en);font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px;overflow-wrap:anywhere}
.parse-info{font-size:13.5px}
.parse-info .warn{color:var(--bad)}
.status{font-size:14px;font-weight:500}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow);z-index:10}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>

<script id="main">
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var store={get:function(k,d){try{var v=localStorage.getItem("wd:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem("wd:"+k,JSON.stringify(v))}catch(e){}}};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function range(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a}
function pad(n){return n<10?"0"+n:""+n}

var deck;try{deck=JSON.parse(document.getElementById("deck-data").textContent)}catch(e){deck={title:"영어 단어장",sets:[]}}
if(!deck.sets)deck.sets=[];
var prefs=Object.assign({accent:"en-US",rate:0.9,auto:true},store.get("prefs",{}));
function savePrefs(){store.set("prefs",prefs)}
var S={setIdx:Math.min(store.get("set",0),Math.max(0,deck.sets.length-1)),view:"cards",canEdit:false,onlyUnknown:false,card:null,quiz:null,game:null};
function cur(){return deck.sets[S.setIdx]||{name:"",items:[]}}
function items(){return cur().items}
function kKey(){return "known:"+cur().name}
function known(){return new Set(store.get(kKey(),[]))}
function saveKnown(k){store.set(kKey(),Array.from(k))}

/* ---------- speech ---------- */
var hasTTS="speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined";
var voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}
if(hasTTS){loadVoices();try{speechSynthesis.addEventListener("voiceschanged",loadVoices)}catch(e){speechSynthesis.onvoiceschanged=loadVoices}}
function pickVoice(lang){
  var norm=function(v){return (v.lang||"").replace("_","-")};
  var same=voices.filter(function(v){return norm(v)===lang});
  var good=/Google|Samantha|Daniel|Natural|Premium|Enhanced|Aria|Jenny|Serena|Libby|Sonia/i;
  return same.filter(function(v){return good.test(v.name)})[0]||same[0]||voices.filter(function(v){return /^en/i.test(v.lang)})[0]||null;
}
var speakingBtn=null;
function speak(text,opt){
  opt=opt||{};
  if(!hasTTS){toast("이 브라우저는 발음 듣기를 지원하지 않아요. 크롬, 사파리, 엣지에서 열어 주세요.");return}
  if(!voices.length)loadVoices();
  var u=new SpeechSynthesisUtterance(text);
  u.lang=prefs.accent;var v=pickVoice(prefs.accent);if(v)u.voice=v;
  u.rate=opt.slow?0.55:prefs.rate;
  if(speakingBtn)speakingBtn.classList.remove("speaking");
  var b=opt.btn||null;speakingBtn=b;
  if(b){b.classList.add("speaking");var off=function(){b.classList.remove("speaking")};u.onend=off;u.onerror=off}
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(function(){speechSynthesis.speak(u)},80)}
    else speechSynthesis.speak(u);
  }catch(e){toast("발음을 재생하지 못했어요. 한 번 더 눌러 주세요.")}
}
var SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.6l4.9 4V5.5l-4.9 4H4z" fill="currentColor"/><path d="M15.8 9a4.2 4.2 0 0 1 0 6M18.6 6.4a8 8 0 0 1 0 11.2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
function spk(text,cls,slow){
  var label=slow?"느리게":(cls&&cls.indexOf("lg")>-1?"듣기":"");
  return '<button type="button" class="spk '+(cls||"")+(label?"":" icon-only")+'" data-say="'+esc(text)+'"'+(slow?' data-slow="1"':'')+' aria-label="'+(slow?"천천히 발음 듣기":"발음 듣기")+'">'+SPK+(label?"<span>"+label+"</span>":"")+'</button>';
}

function renderView(){
  var v=$("#view");if(!v)return;
  stopTimer();
  if(S.view!=="edit"&&S.view!=="login"&&!items().length){v.innerHTML='<div class="panel empty">아직 단어가 없어요.'+(S.canEdit?' <b>단어 입력</b> 탭에서 추가해 주세요.':' 선생님이 단어를 올리면 여기에 나타나요.')+'</div>';return}
  if(S.view==="cards")v.innerHTML=renderCards();
  else if(S.view==="quiz")v.innerHTML=renderQuiz();
  else if(S.view==="game")v.innerHTML=renderGame();

  else if(S.view==="login"){v.innerHTML=renderLogin();var li=$("#login-gh");if(li)li.focus()}
  if(S.view==="game"&&S.game&&S.game.type==="match"&&!S.game.end)startTimer();

}

/* ---------- cards ---------- */
function resetCards(doShuffle){
  var it=items(),k=known();var idx=range(it.length);
  if(S.onlyUnknown)idx=idx.filter(function(i){return !k.has(it[i].en)});
  if(doShuffle)idx=shuffle(idx);
  S.card={order:idx,i:0,flipped:false};
}
function curCard(){return items()[S.card.order[S.card.i]]}
function renderCards(){
  if(!S.card)resetCards(false);
  var it=items(),c=S.card,k=known();
  if(!c.order.length)return '<div class="panel empty"><b style="color:var(--ink);font-size:18px">이 단원의 카드를 모두 외웠어요!</b><div class="row" style="justify-content:center"><button class="btn" data-act="show-all">전체 카드 다시 보기</button><button class="btn primary" data-act="view" data-v="quiz">퀴즈로 확인하기</button></div></div>';
  var item=curCard(),no=c.order[c.i]+1,isK=k.has(item.en);
  var long=(item.en.length>18||/\s\S+\s/.test(item.en))?" long":"";
  return '<div class="cardbar"><span class="count"><b>'+(c.i+1)+'</b> / '+c.order.length+'</span><span class="pill">'+k.size+' / '+it.length+' 외움</span><span class="spacer"></span>'+
   '<label class="check"><input type="checkbox" id="only-unknown"'+(S.onlyUnknown?" checked":"")+'> 모르는 것만</label>'+
   '<label class="check"><input type="checkbox" id="auto-speak"'+(prefs.auto?" checked":"")+'> 넘길 때 자동 발음</label></div>'+
   '<div class="stage"><div class="flash'+(c.flipped?" flipped":"")+'" data-act="flip" role="button" tabindex="0" aria-label="카드 뒤집기">'+
    '<div class="face front" aria-hidden="'+c.flipped+'"><div class="cardno">No. '+pad(no)+'</div>'+(isK?'<span class="tag-known">외움</span>':'')+
     '<div class="word'+long+'" lang="en">'+esc(item.en)+'</div>'+
     '<div class="face-actions">'+spk(item.en,"lg")+spk(item.en,"lg",true)+'</div>'+
     '<div class="hint">카드를 누르면 뜻이 나와요</div></div>'+
    '<div class="face back" aria-hidden="'+(!c.flipped)+'"><div class="cardno">No. '+pad(no)+'</div><div class="side">뜻</div>'+
     '<div class="meaning">'+esc(item.ko)+'</div>'+
     '<div class="en-small" lang="en">'+esc(item.en)+' '+spk(item.en)+'</div>'+
     (item.ex?'<div class="example"><div class="ex-label">Example</div><div class="ex-en" lang="en">'+esc(item.ex)+'</div>'+(item.exKo?'<div class="ex-ko">'+esc(item.exKo)+'</div>':'')+'<div class="ex-row">'+spk(item.ex,"")+spk(item.ex,"",true)+'</div></div>':'')+
    '</div></div></div>'+
   '<div class="cardnav"><button class="btn ghost" data-act="prev"'+(c.i===0?" disabled":"")+' aria-label="이전 카드">←</button>'+
    '<button class="btn again" data-act="again">다시 볼래요</button><button class="btn know" data-act="know">외웠어요</button>'+
    '<button class="btn ghost" data-act="next"'+(c.i>=c.order.length-1?" disabled":"")+' aria-label="다음 카드">→</button></div>'+
   '<div class="subnav"><button class="link" data-act="shuffle">순서 섞기</button>·<button class="link" data-act="reset-known">외움 표시 지우기</button></div>'+
   '<p class="kbd">키보드: ← → 카드 이동 · 스페이스 뒤집기 · Enter 발음 듣기</p>';
}
function moveCard(d){
  var c=S.card,n=c.i+d;
  if(n<0)return;
  if(n>=c.order.length){toast("마지막 카드예요. 순서를 섞어서 한 번 더 해 보세요!");return}
  c.i=n;c.flipped=false;renderView();
  if(prefs.auto)setTimeout(function(){var b=document.querySelector(".front .spk");speak(curCard().en,{btn:b})},120);
}

/* ---------- quiz ---------- */
var MODES={
  meaning:{name:"뜻 고르기",ex:"weekend → 주말",desc:"영어를 보고 알맞은 우리말 뜻을 골라요."},
  english:{name:"영어 고르기",ex:"주말 → weekend",desc:"우리말 뜻을 보고 알맞은 영어를 골라요."},
  listen:{name:"듣고 고르기",ex:"소리 → weekend",desc:"발음만 듣고 어떤 단어인지 골라요."}
};
function makeQs(pool){
  var all=range(items().length);
  return shuffle(pool).slice(0,10).map(function(ai){
    var others=shuffle(all.filter(function(i){return i!==ai})).slice(0,3);
    return {ai:ai,opts:shuffle([ai].concat(others)),picked:null};
  });
}
function startQuiz(mode,pool){
  S.quiz={mode:mode,qs:makeQs(pool||range(items().length)),i:0,score:0,wrong:[]};
  renderView();
  if(mode==="listen")autoPlayQuiz();
}
function autoPlayQuiz(){setTimeout(function(){var q=S.quiz&&S.quiz.qs[S.quiz.i];if(q)speak(items()[q.ai].en,{btn:$(".bigplay")})},250)}
function renderQuiz(){
  var z=S.quiz,it=items();
  if(!z){
    return '<div class="panel"><h2>어떤 퀴즈를 풀어 볼까요?</h2><p class="muted" style="margin:0">'+esc(cur().name)+'에서 최대 10문제가 나와요. 정답을 고르면 발음이 나와요.</p>'+
     '<div class="modes">'+Object.keys(MODES).map(function(m){var d=MODES[m];return '<button class="mode" data-act="quiz-start" data-mode="'+m+'"><b>'+d.name+'</b><div class="ex">'+d.ex+'</div><span>'+d.desc+'</span></button>'}).join("")+'</div></div>';
  }
  if(z.i>=z.qs.length){
    var pct=Math.round(z.score/z.qs.length*100);
    var msg=pct===100?"완벽해요! 모두 맞혔어요.":pct>=70?"잘했어요! 틀린 것만 한 번 더 볼까요?":"괜찮아요. 카드로 복습하고 다시 도전해 봐요.";
    return '<div class="panel"><div class="eyebrow">'+MODES[z.mode].name+' 결과</div><div class="score">'+z.score+'<small> / '+z.qs.length+'</small></div><p style="margin:0">'+msg+'</p>'+
     (z.wrong.length?'<div><div class="ex-label" style="margin-bottom:6px">틀린 단어</div><ul class="review">'+z.wrong.map(function(ai){var w=it[ai];return '<li>'+spk(w.en)+'<span class="en" lang="en">'+esc(w.en)+'</span><span class="ko">'+esc(w.ko)+'</span></li>'}).join("")+'</ul></div>':'')+
     '<div class="row">'+(z.wrong.length?'<button class="btn primary" data-act="quiz-wrong">틀린 것만 다시</button>':'')+'<button class="btn" data-act="quiz-again">새 문제로 다시</button><button class="btn ghost" data-act="quiz-home">다른 퀴즈 고르기</button></div></div>';
  }
  var q=z.qs[z.i],a=it[q.ai],answered=q.picked!==null;
  var prompt;
  if(z.mode==="meaning")prompt='<div class="ask">이 영어의 뜻은?</div><div class="q-en" lang="en">'+esc(a.en)+'</div>'+spk(a.en,"lg");
  else if(z.mode==="english")prompt='<div class="ask">이 뜻을 가진 영어는?</div><div class="q-ko">'+esc(a.ko)+'</div>';
  else prompt='<div class="ask">잘 듣고 들린 영어를 골라요</div><button class="bigplay" data-say="'+esc(a.en)+'" aria-label="다시 듣기">'+SPK+'</button><div class="row" style="justify-content:center">'+spk(a.en,"",true)+'</div>';
  var showEn=z.mode!=="meaning";
  var opts=q.opts.map(function(oi,n){
    var o=it[oi],cls="opt"+(showEn?" en":"");
    if(answered){if(oi===q.ai)cls+=" right";else if(oi===q.picked)cls+=" wrong"}
    return '<button class="'+cls+'" data-act="quiz-pick" data-i="'+oi+'"'+(answered?" disabled":"")+'><span class="n">'+(n+1)+'</span><span'+(showEn?' lang="en"':'')+'>'+esc(showEn?o.en:o.ko)+'</span></button>';
  }).join("");
  var fb="";
  if(answered){
    var ok=q.picked===q.ai;
    fb='<div class="feedback '+(ok?"ok":"no")+'"><b>'+(ok?"정답이에요!":"아쉬워요. 정답은 이거예요.")+'</b><div class="row"><span style="font-family:var(--f-en);font-weight:600" lang="en">'+esc(a.en)+'</span>'+spk(a.en)+'<span class="muted">'+esc(a.ko)+'</span></div>'+(a.ex?'<div class="muted" lang="en" style="font-family:var(--f-en);font-size:14px">'+esc(a.ex)+'</div>':'')+'</div>'+
       '<div class="row end"><button class="btn primary" data-act="quiz-next" id="quiz-next">'+(z.i===z.qs.length-1?"결과 보기":"다음 문제")+' →</button></div>';
  }
  return '<div class="panel"><div class="qhead"><span>'+MODES[z.mode].name+'</span><span>'+(z.i+1)+' / '+z.qs.length+' · 맞힌 개수 '+z.score+'</span></div>'+
   '<div class="progress"><i style="width:'+(z.i/z.qs.length*100)+'%"></i></div>'+
   '<div class="prompt">'+prompt+'</div><div class="opts">'+opts+'</div>'+fb+'</div>';
}

/* ---------- games ---------- */
var timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function startTimer(){stopTimer();timerId=setInterval(function(){var el=$("#timer");if(el&&S.game&&!S.game.end)el.textContent=fmtTime(Date.now()-S.game.start)},250)}
function fmtTime(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+":"+pad(s%60)}
function startMatch(){
  var pick=shuffle(range(items().length)).slice(0,6);
  var tiles=shuffle([].concat.apply([],pick.map(function(i){return [{k:"e"+i,i:i,side:"en"},{k:"k"+i,i:i,side:"ko"}]})));
  S.game={type:"match",tiles:tiles,sel:null,done:{},doneN:0,bad:[],miss:0,start:Date.now(),end:null};
  renderView();
}
function startDict(){
  S.game={type:"dict",qs:shuffle(range(items().length)).slice(0,10),i:0,score:0,state:"ask",hint:0,last:"",wrong:[]};
  renderView();
  playDict();
}
function playDict(slow){setTimeout(function(){var g=S.game;if(g&&g.type==="dict"&&g.i<g.qs.length)speak(items()[g.qs[g.i]].en,{slow:!!slow,btn:$(".bigplay")})},200)}
function norm(s){return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim()}
function renderGame(){
  var g=S.game,it=items();
  if(!g){
    return '<div class="panel"><h2>게임으로 복습해요</h2>'+
     '<div class="modes"><button class="mode" data-act="game-match"><b>짝 맞추기</b><div class="ex">museum ↔ 박물관</div><span>영어와 뜻 카드 6쌍을 빨리 짝지어요. 영어 카드를 누르면 발음이 나와요.</span></button>'+
     '<button class="mode" data-act="game-dict"><b>받아쓰기</b><div class="ex">소리 → 직접 입력</div><span>발음을 듣고 철자를 직접 써요. 문장도 나올 수 있어요.</span></button></div></div>';
  }
  if(g.type==="match"){
    var best=store.get("best:"+cur().name,null);
    if(g.end){
      var t=g.end-g.start;
      return '<div class="panel"><div class="eyebrow">짝 맞추기 완료</div><div class="score">'+fmtTime(t)+'</div><p style="margin:0">틀린 횟수 '+g.miss+'번'+(best?' · 내 최고 기록 '+fmtTime(best):'')+(g.newBest?' · <b style="color:var(--good)">새 기록!</b>':'')+'</p><div class="row"><button class="btn primary" data-act="game-match">한 판 더</button><button class="btn ghost" data-act="game-home">다른 게임</button></div></div>';
    }
    return '<div class="panel"><div class="row" style="justify-content:space-between"><div class="stat"><span>시간 <b id="timer">'+fmtTime(Date.now()-g.start)+'</b></span><span>틀림 <b>'+g.miss+'</b></span><span>남은 쌍 <b>'+((g.tiles.length-g.doneN)/2)+'</b></span></div><button class="link" data-act="game-home">그만하기</button></div>'+
     '<div class="tiles">'+g.tiles.map(function(t){var o=it[t.i];var cls="tile "+t.side+(g.done[t.k]?" gone":"")+(g.sel===t.k?" sel":"")+(g.bad.indexOf(t.k)>-1?" bad":"");return '<button class="'+cls+'" data-act="tile" data-k="'+t.k+'"'+(t.side==="en"?' lang="en"':'')+(g.done[t.k]?' tabindex="-1" aria-hidden="true"':'')+'>'+esc(t.side==="en"?o.en:o.ko)+'</button>'}).join("")+'</div></div>';
  }

    return '<div class="panel"><div class="eyebrow">받아쓰기 결과</div><div class="score">'+g.score+'<small> / '+g.qs.length+'</small></div>'+
     (g.wrong.length?'<ul class="review">'+g.wrong.map(function(w){var o=it[w.ai];return '<li>'+spk(o.en)+'<span class="en" lang="en">'+esc(o.en)+'</span><span class="ko">내가 쓴 답: '+(w.typed?esc(w.typed):'(건너뜀)')+'</span></li>'}).join("")+'</ul>':'<p style="margin:0">하나도 안 틀렸어요. 대단해요!</p>')+
     '<div class="row"><button class="btn primary" data-act="game-dict">다시 하기</button><button class="btn ghost" data-act="game-home">다른 게임</button></div></div>';
  }
  var a=it[g.qs[g.i]],done=g.state!=="ask",ok=g.state==="right";
  var hint="";
  if(g.hint>=1)hint+='<div>뜻: <b>'+esc(a.ko)+'</b></div>';
  if(g.hint>=2)hint+='<div>철자: <span class="mono" lang="en">'+esc(a.en.replace(/[A-Za-z]/g,function(ch,idx,s){return (idx===0||/[^A-Za-z]/.test(s[idx-1]))?ch:"_"}))+'</span></div>';
  return '<div class="panel"><div class="qhead"><span>받아쓰기</span><span>'+(g.i+1)+' / '+g.qs.length+' · 맞힌 개수 '+g.score+'</span></div>'+
   '<div class="progress"><i style="width:'+(g.i/g.qs.length*100)+'%"></i></div>'+
   '<div class="prompt"><div class="ask">잘 듣고 영어로 써 보세요</div><button class="bigplay" data-act="dict-play" aria-label="다시 듣기">'+SPK+'</button><button class="link" data-act="dict-slow">천천히 듣기</button></div>'+
   '<form class="dict-form" id="dict-form" autocomplete="off"><input id="dict-input" lang="en" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="들은 것을 입력하세요" value="'+esc(g.last)+'"'+(done?' readonly class="'+(ok?"ok":"no")+'"':'')+' aria-label="답 입력"><button class="btn primary" type="submit"'+(done?" hidden":"")+'>확인</button></form>'+
   (hint&&!done?'<div class="hintbox">'+hint+'</div>':'')+
   (done?'<div class="feedback '+(ok?"ok":"no")+'"><b>'+(ok?"정답이에요!":"정답은 이거예요.")+'</b><div class="row"><span style="font-family:var(--f-en);font-weight:600;font-size:17px" lang="en">'+esc(a.en)+'</span>'+spk(a.en)+'<span class="muted">'+esc(a.ko)+'</span></div></div><div class="row end"><button class="btn primary" data-act="dict-next" id="dict-next">'+(g.i===g.qs.length-1?"결과 보기":"다음")+' →</button></div>'
     :'<div class="row"><button class="btn" data-act="dict-hint"'+(g.hint>=2?" disabled":"")+'>힌트 보기</button><button class="link" data-act="dict-skip">모르겠어요</button></div>')+

function parse(text){
  var sets=[],curS=null,errors=[];
  text.split(/\r?\n/).forEach(function(line,n){
    var t=line.trim();if(!t)return;
    if(t.charAt(0)==="#"){curS={name:t.replace(/^#+\s*/,"")||"단원 "+(sets.length+1),items:[]};sets.push(curS);return}
    var p=(line.indexOf("\t")>-1?line.split("\t"):line.split("|")).map(function(x){return x.trim()});
    if(!p[0]||!p[1]){errors.push(n+1);return}
    if(!curS){curS={name:"단어 목록",items:[]};sets.push(curS)}
    curS.items.push({en:p[0],ko:p[1],ex:p[2]||"",exKo:p[3]||""});
  });
  return {sets:sets.filter(function(s){return s.items.length}),errors:errors};
}

function ghFetch(method,body){
  var url="https://api.github.com/repos/"+CFG.repo.trim().replace(/^\/+|\/+$/g,"")+"/contents/words.json"+(method==="GET"?"?ref="+encodeURIComponent(CFG.branch)+"&t="+Date.now():"");
  return fetch(url,{method:method,cache:"no-store",headers:{"Authorization":"Bearer "+CFG.gh.trim(),"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {status:r.status,ok:r.ok,j:j}})});
}
function ghError(st){
  if(st===401)return "GitHub 토큰이 맞지 않거나 기간이 끝났어요. 연결 설정에서 토큰을 다시 넣어 주세요.";
  if(st===403)return "토큰에 쓰기 권한이 없어요. 토큰을 만들 때 이 저장소의 Contents를 'Read and write'로 골라 주세요.";
  if(st===404)return "저장소를 찾을 수 없어요. 연결 설정의 저장소 이름(아이디/저장소이름)과 토큰이 이 저장소를 고를 수 있는지 확인해 주세요.";
  if(st===409||st===422)return "다른 곳에서 먼저 저장됐어요. 한 번 더 눌러 주세요.";
  return "저장하지 못했어요 (GitHub 응답 "+st+"). 잠시 후 다시 눌러 주세요.";
}
function save(){
  var title=($("#deck-title").value||"").trim()||"영어 단어장";
  var raw=$("#deck-text").value,r=parse(raw);
  if(!r.sets.length){setStatus("단어를 한 개 이상 입력해 주세요. 예: weekend | 주말","var(--bad)");return}
  if(!CFG.gh||!CFG.repo){setStatus("연결 설정에서 GitHub 저장소와 토큰을 먼저 넣어 주세요.","var(--bad)");openSettings();return}
  var nd={title:title,sample:false,sets:r.sets};
  var b=$("#save-btn");b.disabled=true;setStatus("GitHub에 저장하는 중…");
  ghFetch("GET").then(function(g){
    if(!g.ok&&g.status!==404)throw {st:g.status};
    var body={message:"단어장 업데이트: "+title,content:b64utf8(JSON.stringify(nd,null,1)+"\n"),branch:CFG.branch};
    if(g.ok&&g.j.sha)body.sha=g.j.sha;
    return ghFetch("PUT",body);
  }).then(function(p){
    if(!p.ok)throw {st:p.status};
    deck=nd;draft=raw;S.card=null;S.quiz=null;S.game=null;S.setIdx=Math.min(S.setIdx,deck.sets.length-1);
    renderShell();
    setStatus("저장했어요. 1~2분 뒤 학생 화면에 새 단어가 나와요.","var(--good)");
  }).catch(function(e){
    var bb=$("#save-btn");if(bb)bb.disabled=false;
    setStatus(e&&e.st?ghError(e.st):"GitHub에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.","var(--bad)");
  });
}


/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var sayBtn=e.target.closest("[data-say]");
  if(sayBtn){e.stopPropagation();speak(sayBtn.getAttribute("data-say"),{slow:sayBtn.getAttribute("data-slow")==="1",btn:sayBtn});return}
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.getAttribute("data-act"),it=items();
  switch(act){
    case "view":S.view=el.getAttribute("data-v");document.querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-selected",String(t.getAttribute("data-v")===S.view))});renderView();window.scrollTo({top:0});break;
    case "set":S.setIdx=+el.getAttribute("data-i");store.set("set",S.setIdx);S.card=null;S.quiz=null;S.game=null;renderShell();break;
    case "flip":S.card.flipped=!S.card.flipped;el.classList.toggle("flipped",S.card.flipped);el.querySelector(".front").setAttribute("aria-hidden",S.card.flipped);el.querySelector(".back").setAttribute("aria-hidden",!S.card.flipped);break;
    case "prev":moveCard(-1);break;
    case "next":moveCard(1);break;
    case "know":case "again":{var k=known(),w=curCard().en;if(act==="know")k.add(w);else k.delete(w);saveKnown(k);if(S.card.i<S.card.order.length-1)moveCard(1);else{renderView();toast(act==="know"?"한 바퀴 끝! 모르는 것만 골라서 다시 볼 수 있어요.":"마지막 카드예요.")}break}
    case "shuffle":resetCards(true);renderView();toast("카드 순서를 섞었어요.");break;
    case "reset-known":saveKnown(new Set());resetCards(false);renderView();toast("외움 표시를 지웠어요.");break;
    case "show-all":S.onlyUnknown=false;resetCards(false);renderView();break;
    case "quiz-start":startQuiz(el.getAttribute("data-mode"));break;
    case "quiz-pick":{var q=S.quiz.qs[S.quiz.i];if(q.picked!==null)return;q.picked=+el.getAttribute("data-i");if(q.picked===q.ai)S.quiz.score++;else S.quiz.wrong.push(q.ai);renderView();speak(it[q.ai].en,{});var nb=$("#quiz-next");if(nb)nb.focus({preventScroll:true});break}
    case "quiz-next":S.quiz.i++;renderView();if(S.quiz.mode==="listen"&&S.quiz.i<S.quiz.qs.length)autoPlayQuiz();break;
    case "quiz-wrong":startQuiz(S.quiz.mode,S.quiz.wrong.slice());break;
    case "quiz-again":startQuiz(S.quiz.mode);break;
    case "quiz-home":S.quiz=null;renderView();break;
    case "game-home":S.game=null;renderView();break;
    case "game-match":startMatch();break;
    case "game-dict":startDict();break;
    case "tile":{var g=S.game,key=el.getAttribute("data-k");if(g.done[key]||g.end)return;var t=g.tiles.filter(function(x){return x.k===key})[0];
      if(t.side==="en")speak(it[t.i].en,{});
      if(!g.sel||g.sel===key){g.sel=g.sel===key?null:key;g.bad=[];renderView();return}
      var s=g.tiles.filter(function(x){return x.k===g.sel})[0];
      if(s.side===t.side){g.sel=key;renderView();return}
      if(s.i===t.i){g.done[s.k]=g.done[t.k]=true;g.doneN+=2;g.sel=null;
        if(g.doneN===g.tiles.length){g.end=Date.now();var best=store.get("best:"+cur().name,null);if(!best||g.end-g.start<best){store.set("best:"+cur().name,g.end-g.start);g.newBest=!!best}}
      }else{g.miss++;g.bad=[s.k,t.k];g.sel=null;setTimeout(function(){if(S.game===g){g.bad=[];renderView()}},500)}
      renderView();break}
    case "dict-play":playDict(false);break;
    case "dict-slow":playDict(true);break;
    case "dict-hint":S.game.hint++;S.game.last=($("#dict-input")||{}).value||"";renderView();break;
    case "dict-skip":{var gd=S.game;gd.last="";gd.state="wrong";gd.wrong.push({ai:gd.qs[gd.i],typed:""});renderView();speak(it[gd.qs[gd.i]].en,{});var dn=$("#dict-next");if(dn)dn.focus({preventScroll:true});break}
    case "dict-next":{var gn=S.game;gn.i++;gn.state="ask";gn.hint=0;gn.last="";renderView();if(gn.i<gn.qs.length)playDict();break}
    case "save":save();break;
    case "cfg-save":["repo","branch","gh","gem","model"].forEach(function(k){var i=$("#cfg-"+k);if(i)CFG[k]=i.value.trim()});if(!CFG.branch)CFG.branch="main";if(!CFG.model)CFG.model="gemini-3.8-flash";saveCfg();cfgOpen=false;renderView();toast("연결 설정을 저장했어요.");break;
    case "cfg-clear":CFG.gh="";CFG.gem="";saveCfg();store.set("teacher",false);S.canEdit=false;S.view="cards";renderShell();toast("이 브라우저에서 토큰과 키를 지웠어요.");break;
    case "teacher-off":store.set("teacher",false);CFG.gh="";CFG.gem="";saveCfg();S.canEdit=false;S.view="cards";renderShell();toast("로그아웃했어요. 이 기기에서 토큰과 키를 지웠어요.");break;
    case "login-cancel":S.view="cards";if(location.hash==="#teacher")history.replaceState(null,"",location.pathname+location.search);renderShell();break;
    case "imp-run":runImport();break;
    case "imp-stop":if(IMP.ctl)IMP.ctl.abort();break;
    case "edit-revert":draft=null;try{sessionStorage.removeItem("wd:unsent")}catch(x){}renderView();break;
  }
});
document.addEventListener("submit",function(e){
  if(e.target.id==="login-form"){e.preventDefault();
    var repo=$("#login-repo").value,tok=$("#login-gh").value,st=$("#login-status"),btn=$("#login-btn");
    if(!repo.trim()||!tok.trim()){st.textContent="저장소 이름과 토큰을 모두 넣어 주세요.";st.style.color="var(--bad)";return}
    btn.disabled=true;st.style.color="";st.textContent="GitHub에서 확인하는 중…";
    verifyTeacher(repo,tok).then(function(r){CFG.repo=r;CFG.gh=tok.trim();saveCfg();store.set("teacher",true);unlock();toast("선생님 확인이 끝났어요.")},
      function(msg){btn.disabled=false;st.textContent=msg;st.style.color="var(--bad)"});
    return;
  }
  if(e.target.id!=="dict-form")return;e.preventDefault();
  var g=S.game;if(!g||g.state!=="ask")return;
  var v=$("#dict-input").value;if(!v.trim()){toast("들은 단어를 입력해 주세요.");return}
  var a=items()[g.qs[g.i]];g.last=v;
  if(norm(v)===norm(a.en)){g.state="right";g.score++}else{g.state="wrong";g.wrong.push({ai:g.qs[g.i],typed:v})}
  renderView();var dn=$("#dict-next");if(dn)dn.focus({preventScroll:true});
});
document.addEventListener("change",function(e){
  var id=e.target.id;
  if(id==="p-accent"){prefs.accent=e.target.value;savePrefs()}
  else if(id==="p-rate"){prefs.rate=parseFloat(e.target.value);savePrefs()}
  else if(id==="auto-speak"){prefs.auto=e.target.checked;savePrefs()}
  else if(id==="imp-file"){pickFile(e.target.files&&e.target.files[0])}
  else if(id==="only-unknown"){S.onlyUnknown=e.target.checked;resetCards(false);renderView()}
});
document.addEventListener("dragover",function(e){var d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",function(e){var d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",function(e){var d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.remove("over");pickFile(e.dataTransfer.files&&e.dataTransfer.files[0])}});
document.addEventListener("input",function(e){if(e.target.id==="deck-text"){draft=e.target.value;updateParseInfo()}});
document.addEventListener("keydown",function(e){
  if(S.view!=="cards"||!S.card||!S.card.order.length)return;
  var tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea"||tag==="select")return;
  if(e.key==="ArrowRight"){moveCard(1);e.preventDefault()}
  else if(e.key==="ArrowLeft"){moveCard(-1);e.preventDefault()}
  else if(e.key===" "){var f=$(".flash");if(f){f.click();e.preventDefault()}}
  else if(e.key==="Enter"&&!(e.target.closest&&e.target.closest("button:not(.flash)"))){speak(curCard().en,{btn:$(".front .spk")});e.preventDefault()}
});

/* ---------- teacher mode & loading words.json ---------- */
function checkTeacher(){
  if(location.hash==="#teacher"&&!S.canEdit){S.view="login";renderShell()}
}
window.addEventListener("hashchange",checkTeacher);
function start(){
  /* a device stays unlocked only while it still holds the verified token */
  if(store.get("teacher",false)&&CFG.gh){S.canEdit=true;if(location.hash==="#teacher"){S.view="edit";history.replaceState(null,"",location.pathname+location.search)}}
  if(location.hash==="#teacher"&&!S.canEdit)S.view="login";
  renderShell();
}
if(/^https?:$/.test(location.protocol)){
  $("#app").innerHTML='<div class="wrap"><div class="panel empty">단어를 불러오는 중…</div></div>';
  fetch("words.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){
    if(d&&Array.isArray(d.sets)){deck=d;S.setIdx=Math.min(S.setIdx,Math.max(0,deck.sets.length-1))}
  }).catch(function(){}).then(start);
}else start();
})();
</script>
